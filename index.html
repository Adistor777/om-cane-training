<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>O&M Cane Training — Teacher App</title>

<!-- =========================================================================
     THE APP — markup shell. The pieces live in four files, loaded in order:
       activities.js — CONTENT (categories, activities, SOPs, data fields).
                       Content team edits THAT and nothing else.
       styles.css    — the LOOK (see design guardrails below).
       store.js      — the STORAGE SEAM (the only code that touches the
                       storage backend; swap point for cloud sync).
       app.js        — everything else: rendering, navigation, behaviour.
     No bundler, no build step — plain files, deliberate and load-bearing.
     Build/verify with scripts/build.sh (copies these to www/ + cap sync).

     DESIGN GUARDRAILS live at the top of styles.css — read them BEFORE
     touching the look. Full rationale in DESIGN_NOTES.md. Behaviour, data,
     storage, and all accessibility fixes (post-save focus, SOP animation,
     reduced-motion, fieldset/legend) are settled — don't regress them.
     ========================================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Arimo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- BRAND MOMENT (2026-07-31). The funder mark, shown for a beat on launch.

     WHY THIS IS HERE AND NOT A NATIVE SPLASH: the launch theme's parent is
     Theme.SplashScreen, so from Android 12 the SYSTEM draws the launch screen
     and ignores android:background entirely — the legacy drawable/splash.png
     never appears. The system splash also circle-masks whatever icon it is
     given, and this mark is a ~5:1 wordmark, so it cannot survive that crop at
     any size. Doing it in the web layer is the only way the wordmark renders
     as designed, and it has two side benefits: it is identical on every API
     level, and it lives in git (android/ is gitignored, so a native splash
     would quietly vanish the next time android/ is regenerated).

     It is inert to assistive tech: aria-hidden, nothing focusable inside, and
     app.js removes it from the DOM after the fade. Focus is never inside it,
     so removal cannot strand a screen reader (the removeAfterFocus lesson).

     USE THE WEB-SIZED DERIVATIVE, never img/bif-logo.png. The supplied master
     is 6000x3375 — about 81 MB once decoded — and Android's WebView silently
     declines to paint it, which is exactly why the mark was invisible on the
     first attempt while the smaller child illustration rendered fine. The
     master stays in img/ as the source to regenerate from; only the -mark-
     files are ever referenced. -->
<div id="brandGate" aria-hidden="true">
  <img src="./img/bif-mark-white.png" alt="">
</div>
<header>
  <button class="back" id="backBtn" aria-label="Go back" style="display:none;">
    <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="hmenu" id="hmenu" style="display:none;">
    <button class="hmenu-btn" id="hmenuBtn" aria-label="Open menu" aria-haspopup="dialog" aria-expanded="false" onclick="toggleMenu(event)">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div>
    <p class="brand" id="brand">O&amp;M Cane Training</p>
    <!-- The crumb is the app's "where am I". It is decorative for a screen
         reader BECAUSE the same words are already spoken by the screen title
         that paint() focuses on every navigation — announcing both makes every
         screen change stutter its own name twice. Sighted-only on purpose. -->
    <div class="crumb" id="crumb" aria-hidden="true">Choose an activity category</div>
  </div>
</header>
<main class="wrap" id="main">
  <!-- paint() moves focus to each screen's heading on navigation, so this
       region is what a screen reader lands in. Labelled so jumping by landmark
       says something useful. -->
  <div id="screen"></div>
</main>
<!-- The VISIBLE toast. aria-hidden on purpose: it is the sighted half only.
     Announcements go through #srStatus below, which is written on a later
     frame — see toast() in app.js for why the two are separated. -->
<div class="toast" id="toast" aria-hidden="true"></div>
<!-- The SPOKEN half. A polite live region (never assertive — it fires while
     drill audio is playing, and that sound is the whole activity). -->
<div class="visually-hidden" id="srStatus" role="status" aria-live="polite"></div>
<script src="activities.js"></script>
<!-- Vendored supabase-js UMD (exposes window.supabase). Local file, NO CDN —
     the app must boot fully offline. Loaded BEFORE store.js: the Cloud seam
     there reads window.supabase at init. -->
<script src="supabase.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
