<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>O&M Cane Training — Teacher App</title>

<!-- =========================================================================
     THE APP — markup shell. The pieces live in four files, loaded in order:
       activities.js — CONTENT (categories, activities, SOPs, data fields).
                       Content team edits THAT and nothing else.
       styles.css    — the LOOK (see design guardrails below).
       store.js      — the STORAGE SEAM (the only code that touches the
                       storage backend; swap point for cloud sync).
       app.js        — everything else: rendering, navigation, behaviour.
     No bundler, no build step — plain files, deliberate and load-bearing.
     Build/verify with scripts/build.sh (copies these to www/ + cap sync).

     DESIGN GUARDRAILS live at the top of styles.css — read them BEFORE
     touching the look. Full rationale in DESIGN_NOTES.md. Behaviour, data,
     storage, and all accessibility fixes (post-save focus, SOP animation,
     reduced-motion, fieldset/legend) are settled — don't regress them.
     ========================================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <button class="back" id="backBtn" aria-label="Go back" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <span class="home-dot" id="homeDot" role="button" tabindex="0" aria-label="Home"></span>
  <div>
    <p class="brand" id="brand">O&amp;M Cane Training</p>
    <div class="crumb" id="crumb">Choose an activity category</div>
  </div>
  <div class="hmenu" id="hmenu" style="display:none;">
    <button class="hmenu-btn" id="hmenuBtn" aria-label="More options" aria-haspopup="true" aria-expanded="false" onclick="toggleMenu(event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </button>
    <div class="hmenu-pop" id="hmenuPop" role="menu" hidden></div>
  </div>
</header>
<main class="wrap"><div id="screen"></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="activities.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
